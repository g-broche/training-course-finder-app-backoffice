@if (isLoading) {
  <app-loading-spinner />

} @else if (error && !isLoading) {
  <app-error-state [error]="error" />

} @else if (announce) {
  <div class="container">
    <app-announce-details
      [announce]="announce"
      [isUpdatingStatus]="isUpdatingStatus"
      [showStatusMenu]="showStatusMenu"
      [availableStatuses]="getAvailableStatuses()"
      [onToggleStatusMenu]="onToggleStatusMenu"
      [onChangeRecordStatus]="onChangeRecordStatus"
    />
  </div>
}
