<div class="container">
  <div class="page-header">
    <h1>Users</h1>
    @if (totalElements > 0) {
      <p>{{ totalElements }} total user{{ totalElements !== 1 ? "s" : "" }}</p>
    }
  </div>

  <form class="filter-form" (ngSubmit)="applyFilter()">
    <h3>Filter</h3>
    <div class="filter-inputs">
      <div class="form-group">
        <label for="filterDisplayName">Display Name</label>
        <input
          type="text"
          id="filterDisplayName"
          name="filterDisplayName"
          [(ngModel)]="filterDisplayName"
          placeholder="Search by display name..."
        />
      </div>
    </div>
    <div class="form-actions">
      <app-button
        [label]="'Apply Filter'"
        [category]="'action'"
        [buttonType]="'submit'"
        [isDisabled]="initialLoading || paginating"
      />
      <app-button
        [label]="'Clear Filter'"
        [category]="'neutral'"
        [isDisabled]="initialLoading || paginating"
        (callback)="clearFilter()"
      />
    </div>
  </form>

  <app-user-list [users]="users" [loading]="initialLoading"> </app-user-list>

  <app-pagination
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    [disabled]="paginating"
    (pageChange)="goToPage($event)"
  >
  </app-pagination>
</div>
