<a
  [routerLink]="routerLink"
  [queryParams]="queryParams"
  [class]="'btn'"
  [class.btn-positive]="category === 'positive'"
  [class.btn-warning]="category === 'warning'"
  [class.btn-danger]="category === 'danger'"
  [class.btn-neutral]="category === 'neutral'"
  [class.btn-action]="category === 'action'"
  [class.disabled]="isDisabled"
  [attr.aria-disabled]="isDisabled"
  (click)="isDisabled ? $event.preventDefault() : null"
>
  {{ label }}
</a>
